[package]
  cjc-version = "1.0.5"
  name = "cjh"
  description = "nothing here"
  version = "1.3.1"
  target-dir = ""
  output-type = "executable"
  bin-name = "cjh"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  cjterm = { path = "./libs/cjterm" }
  cjllm = { path = "./libs/cjllm" }
  cjcfg = { path = "./libs/cjcfg" }
  cjutil = { path = "./libs/cjutil" }
  cjlog = { path = "./libs/cjlog" }

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["/root/.cangjie/stdx/cangjie-stdx-linux-x64-1.0.5.1/dynamic/stdx"]

# Windows 交叉构建（cjc --target x86_64-pc-windows-gnu）
[target.x86_64-pc-windows-gnu.bin-dependencies]
    path-option = ["/root/.cangjie/stdx/cangjie-stdx-windows-x64-1.0.5.1/windows_x86_64_cjnative/dynamic/stdx"]
    link-option = ""
